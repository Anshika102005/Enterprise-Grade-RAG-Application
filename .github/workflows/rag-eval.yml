name: RAG Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly regression sweep (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Always-on, no secrets, no external services. Fast feedback on PRs.
  unit-tests:
    name: Offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        # These only import pure modules (RRF fusion, grader parsing, chunker)
        # so they need none of the heavy runtime dependencies.
        run: pytest tests/ -q

  # Gated quality evaluation. Runs only when a deployed backend + judge key are
  # configured, so it never blocks contributors on forks.
  eval:
    name: RAGAS + DeepEval quality gates
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ vars.BACKEND_URL != '' && github.event_name != 'pull_request' }}
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      JUDGE_GROQ: ${{ secrets.JUDGE_GROQ }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HUGGINGFACE_EMBEDDING_MODEL: sentence-transformers/all-mpnet-base-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirement.txt') }}

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/" > /dev/null; then
              echo "Backend is up"; exit 0
            fi
            echo "Waiting for backend ($i/30)..."; sleep 5
          done
          echo "Backend did not become healthy"; exit 1

      - name: RAGAS evaluation
        run: python -m evals.run_ragas --record evals/fixtures/samples.json

      - name: DeepEval evaluation
        run: python -m evals.run_deepeval --samples evals/fixtures/samples.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/results/
